name: WebGL Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download WebGL build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download webgl-main-f892ee0 --repo "$GITHUB_REPOSITORY" --pattern cargo-stack-webgl-f892ee0.tar.gz
      - name: Extract
        run: mkdir _site && tar -xzf cargo-stack-webgl-f892ee0.tar.gz -C _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
